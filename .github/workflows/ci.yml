name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - name: Test rendering, layout, and CLI
        run: python -m pytest -q
      - name: Run installed command
        run: proxy15 --help
      - name: Generate Christmas cards
        run: python -m proxy15 demo --output .ci-demo
      - name: Generate duplex calibration sheet
        run: python -m proxy15 calibrate --output .ci-duplex-test
